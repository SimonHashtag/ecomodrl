# Example parameters for the Brock-Mirman stochastic growth model

gamma = 2.0     # CRRA coefficient (> 0)
beta = 0.95     # Discount factor in (0, 1)
delta = 0.02    # Capital depreciation in [0, 1]
alpha = 0.33    # Capital share in (0, 1)
rho = 0.95      # Productivity persistence, |rho| < 1
sigma = 0.007   # Std. dev. of productivity shocks (>= 0)
