# Example parameters for the Buffer–Stock Savings model (Carroll, 1997)

gamma = 2.0                 # γ: CRRA risk aversion (>0), γ=1 → log utility
beta = 0.95                 # β: subjective discount factor ∈ (0,1)
r = 0.02                    # r: net interest rate per period (R = 1 + r), must be > -1
g = 0.01                    # g: permanent income growth rate per period (G = 1 + g), must be > -1

sigma_tran = 0.1            # σ_θ: std. dev. of transitory log shock (≥0)
sigma_perm = 0.1            # σ_ψ: std. dev. of permanent log shock (≥0)

unemployment_prob = 0.005   # p: probability of unemployment shock (point mass at θ_low) ∈ [0,1)
theta_low = 0.3             # θ_low: transitory income when unemployed, normalized ∈ [0,1]